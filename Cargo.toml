[package]
name = "wall-web-paper"
version = "0.1.0"
edition = "2024"
description = "Wayland HTML/CSS/JS wallpaper engine powered by GTK4, gtk4-layer-shell, and WebKitGTK 6.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webkit6 = "0.6"
